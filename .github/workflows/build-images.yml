name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Repo-scoped path. The default GITHUB_TOKEN can ONLY push to packages
  # under ghcr.io/<owner>/<repo>/... — user-namespace pushes
  # (ghcr.io/<owner>/...) require a PAT with write:packages scope.
  # github.repository expands to "Seceo-Knight/Seceoknight-DLP".
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: manager
            dockerfile: ./server/Dockerfile
            context: ./server
          - service: dashboard
            dockerfile: ./dashboard/Dockerfile
            context: ./dashboard

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # `:latest` intentionally NEVER tagged from this legacy/duplicate
      # workflow (kept only for its per-branch/per-tag builds, e.g. PR
      # preview tags). Both this workflow AND build-and-push.yml used to
      # push a `:latest` tag to ghcr.io/dlp-dashboard and dlp-manager --
      # build-and-push.yml unconditionally, this one only from `main` --
      # so whichever workflow finished last silently decided what
      # production ran, regardless of which branch actually had a given
      # fix. A push to `main` (unrelated feature work, still active on
      # this repo) clobbered a File Transfer Monitoring dashboard fix
      # that had already landed on `master`, and no amount of re-running
      # update.sh or hard-refreshing the browser could fix it because the
      # deployed image itself was simply the wrong build. See
      # build-and-push.yml's own trigger comment for the other half of
      # this fix -- that workflow (master-only now) is the single
      # remaining source of the `:latest` tag, matching what
      # update.sh/docker-compose.prod.yml actually deploy from.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/dlp-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6.16.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
