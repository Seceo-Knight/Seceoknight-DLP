name: Build and Push Docker Images

# `master` ONLY. This workflow tags every image it builds `:latest` --
# the exact tag docker-compose.prod.yml pulls in production (see
# update.sh) -- unconditionally, regardless of which branch triggered
# the run. With `main` also listed here, an unrelated push to `main`
# (a second active branch in this repo, used for other feature work)
# would silently overwrite the production `:latest` tag with a build
# that doesn't contain whatever was just fixed on `master` -- which is
# exactly what happened: a File Transfer Monitoring dashboard fix
# (commit a6dbe86) landed on `master`, but a same-day push to `main`
# re-tagged `:latest` with `main`'s dashboard build (which never had
# that fix) right after, so `update.sh` kept pulling the wrong image
# no matter how many times it was re-run or how thoroughly the browser
# was cache-busted -- the deployed image itself was simply the wrong
# one. `master` is the only branch update.sh's own config-file sync
# targets (GITHUB_BRANCH default, see that script), so it's the only
# branch that should ever be able to move production's `:latest` tag.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Workflow-level permissions — required for GHCR push with GITHUB_TOKEN
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Derive lowercase owner (GHCR requires all-lowercase image names)
      - name: Set image names
        id: images
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "manager=ghcr.io/${OWNER}/dlp-manager" >> $GITHUB_OUTPUT
          echo "dashboard=ghcr.io/${OWNER}/dlp-dashboard" >> $GITHUB_OUTPUT
          echo "smtp_relay=ghcr.io/${OWNER}/dlp-smtp-relay" >> $GITHUB_OUTPUT

      - name: Build and push manager image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.manager }}:latest
            ${{ steps.images.outputs.manager }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.dashboard }}:latest
            ${{ steps.images.outputs.dashboard }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push smtp-relay image
        uses: docker/build-push-action@v6
        with:
          context: ./smtp-relay
          file: ./smtp-relay/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.smtp_relay }}:latest
            ${{ steps.images.outputs.smtp_relay }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
