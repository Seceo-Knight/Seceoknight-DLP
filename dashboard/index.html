<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Was a single 500x500 PNG (/logo.png) doing double duty as the favicon --
      it rendered, so this wasn't CyberSentinel's exact "empty globe" bug
      (their icon pointed at a /vite.svg that never existed), but the same
      underlying quality gap applies: browsers pick different sizes for
      different contexts (16 for the tab, 32 for the bookmark bar, 48 for a
      Windows shortcut), and a single full-frame image includes the logo's
      thin circuit "wing" traces either side of the shield, which alias into
      a smudge once downscaled that small. Ships a proper multi-size .ico
      (16/32/48) plus a 180px apple-touch-icon instead, both cropped to the
      shield's dense body alone -- gap-scan of CyberSentinel-DLP commit
      9e33d32, August 27, 2026.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy is also set by nginx in dashboard/nginx.conf,
      but mirroring it as a <meta> tag means the policy is enforced even
      when the SPA is served by `vite preview`, `npm start`, a developer
      machine, or any deployment that does not front the build with this
      exact nginx config. Without this, an XSS during dev would have full
      power.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>SeceoKnight DLP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
